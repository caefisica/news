name: deploy

on:
  push:
    branches: [master]

# Queue deployments so a newer push does not cancel an in-progress deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  check:
    name: typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run lint

  migrate:
    name: d1 migrations
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run db:migrate

  deploy:
    name: deploy ${{ matrix.worker }}
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: news
            directory: .
          - worker: news-reader-coordinator
            directory: workers/coordinator
          - worker: news-reader-consumer
            directory: workers/consumer
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run deploy
        working-directory: ${{ matrix.directory }}
