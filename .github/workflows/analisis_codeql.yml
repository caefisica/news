name: 🚓 Análisis de código

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 11 * * 5" # Viernes a las 11:00

jobs:
  analyze:
    name: Analizar
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]

    steps:
      - name: Inicializar Github Action
        uses: actions/checkout@v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}

      - name: Autoconstruir
        uses: github/codeql-action/autobuild@v4.38.3

      - name: Análisis CodeQL
        uses: github/codeql-action/analyze@v4.38.3
