name: setup
description: Install Node, Bun and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"

    # Use the Bun version pinned in mise.toml.
    - uses: jdx/mise-action@v5
      with:
        install_args: bun

    - run: bun install --frozen-lockfile
      shell: bash
